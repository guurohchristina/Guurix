<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guurix — Logic In Motion</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            /* The deep, realistic ambient studio lighting from the background of the video */
            background: radial-gradient(circle at 80% 20%, #f1f5f9 0%, #cbd5e1 50%, #94a3b8 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            perspective: 1000px;
        }

        /* The main floating UI dashboard panel from the video clip */
        .glass-panel {
            width: 90vw;
            max-width: 1080px;
            height: 600px;
            background: rgba(255, 255, 255, 0.35);
            backdrop-filter: blur(30px) saturate(160%);
            -webkit-backdrop-filter: blur(30px) saturate(160%);
            border: 1px solid rgba(255, 255, 255, 0.7);
            border-radius: 28px;
            box-shadow: 0 30px 70px rgba(15, 23, 42, 0.15),
                        inset 0 1px 0 rgba(255,255,255,0.6);
            display: grid;
            grid-template-columns: 1.1fr 0.9fr;
            padding: 45px;
            position: relative;
            overflow: hidden;
        }

        /* Top Navigation Header bar */
        .panel-header {
            position: absolute;
            top: 35px;
            left: 45px;
            right: 45px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 10;
        }

        .brand-identity {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 700;
            font-size: 18px;
            color: #0f172a;
            letter-spacing: -0.3px;
        }

        /* Pill Menu Container */
        .pill-nav {
            background: rgba(15, 23, 42, 0.06);
            padding: 4px;
            border-radius: 100px;
            display: flex;
            gap: 2px;
            backdrop-filter: blur(5px);
        }

        .pill-nav a {
            text-decoration: none;
            color: #334155;
            font-size: 12px;
            font-weight: 600;
            padding: 6px 18px;
            border-radius: 100px;
            transition: all 0.2s ease;
        }

        .pill-nav a.active {
            background: #0f172a;
            color: #ffffff;
        }

        .header-action .btn-black {
            background: #0f172a;
            color: #ffffff;
            border: none;
            padding: 8px 18px;
            border-radius: 100px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
        }

        /* Left Column Text & Metrics Elements */
        .main-content {
            display: flex;
            flex-direction: column;
            justify-content: center;
            height: 100%;
            padding-top: 40px;
            z-index: 5;
        }

        .hero-title {
            font-size: 52px;
            font-weight: 800;
            line-height: 1.05;
            color: #0f172a;
            letter-spacing: -1.5px;
            margin-bottom: 16px;
        }

        .hero-desc {
            font-size: 14px;
            color: #475569;
            max-width: 380px;
            line-height: 1.5;
            margin-bottom: 50px;
        }

        /* The minimal horizontal statistics display block */
        .stats-row {
            display: flex;
            gap: 40px;
            border-top: 1px solid rgba(15, 23, 42, 0.08);
            padding-top: 25px;
            max-width: 420px;
        }

        .stat-block {
            display: flex;
            flex-direction: column;
        }

        .stat-value {
            font-size: 32px;
            font-weight: 700;
            color: #0f172a;
            letter-spacing: -0.5px;
        }

        .stat-label {
            font-size: 11px;
            font-weight: 500;
            color: #64748b;
            margin-top: 2px;
        }

        /* Right Column containing the massive Glowing Abstract 3D Object Mesh */
        .art-canvas {
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100%;
        }

        /* The signature vibrant neon electric-blue mesh sphere from the concept clip */
        .fluid-sphere-core {
            width: 340px;
            height: 340px;
            background: radial-gradient(circle at 35% 35%, #38bdf8 0%, #0284c7 40%, #0369a1 70%, #0f172a 100%);
            border-radius: 50%;
            position: relative;
            box-shadow: 0 40px 80px rgba(2, 132, 199, 0.35),
                        inset -20px -20px 60px rgba(15, 23, 42, 0.7);
            filter: contrast(1.15);
            animation: floatOrb 8s ease-in-out infinite alternate;
        }

        /* Outer looping overlay ring creating the depth intersection layers */
        .fluid-sphere-core::before {
            content: '';
            position: absolute;
            top: -10%; left: -10%;
            width: 120%; height: 120%;
            border: 24px solid rgba(255, 255, 255, 0.15);
            border-radius: 50%;
            mask-image: linear-gradient(to bottom, black, transparent);
            -webkit-mask-image: linear-gradient(to bottom, black, transparent);
            transform: rotate(-15deg);
        }

        /* Subtle organic wave morph animation to mirror the video background */
        @keyframes floatOrb {
            0% {
                transform: translateY(0px) scale(1) rotate(0deg);
                border-radius: 50% 48% 52% 50% / 50% 52% 48% 50%;
            }
            100% {
                transform: translateY(-15px) scale(1.03) rotate(5deg);
                border-radius: 48% 52% 49% 51% / 52% 49% 51% 48%;
            }
        }

        /* Interactive floating status node */
        .node-tag {
            position: absolute;
            background: rgba(255, 255, 255, 0.8);
            border: 1px solid #ffffff;
            padding: 8px 14px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: 600;
            color: #0f172a;
            box-shadow: 0 10px 20px rgba(0,0,0,0.04);
            top: 25%;
            right: 15%;
            backdrop-filter: blur(10px);
        }

        /* Responsive configuration */
        @media (max-width: 868px) {
            .glass-panel {
                grid-template-columns: 1fr;
                height: auto;
                padding-top: 100px;
                gap: 40px;
            }
            .art-canvas {
                height: 300px;
            }
            .fluid-sphere-core {
                width: 240px;
                height: 240px;
            }
        }
    </style>
</head>
<body>

    <!-- Frosted Glass Interface Stage Layer -->
    <div class="glass-panel">
        
        <!-- Header Controls Block -->
        <div class="panel-header">
            <div class="brand-identity">
                <!-- Custom Geometric Token Alignment -->
                <svg width="22" height="22" viewBox="0 0 100 100" style="display: block;">
                    <circle cx="50" cy="50" r="44" fill="none" stroke="#0f172a" stroke-width="12"/>
                    <circle cx="50" cy="50" r="22" fill="none" stroke="#0f172a" stroke-width="8"/>
                    <path d="M 50,12 L 50,50 L 78,50" fill="none" stroke="#0f172a" stroke-width="10" stroke-linecap="round"/>
                </svg>
                <span>CoreSentinel</span>
            </div>
            
            <div class="pill-nav">
                <a href="#" class="active">Product</a>
                <a href="#">Dataset</a>
            </div>
            
            <div class="header-action">
                <button class="btn-black">Get Started</button>
            </div>
        </div>

        <!-- Left Narrative Column -->
        <div class="main-content">
            <h1 class="hero-title">Smarter Security<br>Starts Here</h1>
            <p class="hero-desc">Secure the sphere. Protect what matters most with intelligent motion architecture patterns.</p>
            
            <div class="stats-row">
                <div class="stat-block">
                    <span class="stat-value">112+</span>
                    <span class="stat-label">System Nodes</span>
                </div>
                <div class="stat-block">
                    <span class="stat-value">55K+</span>
                    <span class="stat-label">Active Modules</span>
                </div>
            </div>
        </div>

        <!-- Right 3D Visual Mesh Art Column -->
        <div class="art-canvas">
            <div class="node-tag">AI-Driven UI</div>
            <div class="fluid-sphere-core"></div>
        </div>

    </div>

</body>
</html>
