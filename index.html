<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>Zyra UI</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<style>

:root{
  --bg-black:#000000;
  --bg-carbon:#0b0c10;
  --text-primary:#ffffff;
  --text-muted:#94a3b8;
  --glass:rgba(15,15,20,0.58);
  --border-soft:rgba(255,255,255,0.08);
  --accent:#d4ff00;
}

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

html,
body{
  width:100%;
  height:100%;
}

body{
  overflow:hidden;

  font-family:"Inter",sans-serif;

  background:
  radial-gradient(circle at top left, rgba(180,255,0,0.05), transparent 35%),
  radial-gradient(circle at bottom right, rgba(255,255,255,0.03), transparent 30%),
  #000000;

  display:flex;
  align-items:center;
  justify-content:center;

  perspective:1800px;

  color:white;
}

.panel{

  position:relative;

  width:min(92vw,1500px);
  height:min(88vh,860px);

  overflow:hidden;

  border-radius:28px;

  background:rgba(15,15,20,0.58);

  backdrop-filter:blur(26px);
  -webkit-backdrop-filter:blur(26px);

  border:1px solid rgba(255,255,255,0.08);

  box-shadow:
  0 0 0 1px rgba(255,255,255,0.03) inset,
  0 30px 80px rgba(0,0,0,0.65),
  0 0 120px rgba(204,255,0,0.04);

  animation:floatPanel 6s ease-in-out infinite;
}

@keyframes floatPanel{
  0%{
    transform:translateY(0px);
  }
  50%{
    transform:translateY(-4px);
  }
  100%{
    transform:translateY(0px);
  }
}

.navbar{

  position:relative;
  z-index:20;

  width:100%;

  padding:32px 36px;

  display:flex;
  align-items:center;
  justify-content:space-between;
}

.brand{

  display:flex;
  align-items:center;
  gap:14px;

  font-size:1.2rem;
  font-weight:700;
}

.brand-icon{

  position:relative;

  width:26px;
  height:26px;
}

.brand-icon::before,
.brand-icon::after{

  content:"";

  position:absolute;

  width:2px;
  height:28px;

  background:rgba(255,255,255,0.9);

  border-radius:999px;
}

.brand-icon::before{
  transform:rotate(35deg);
  left:6px;
}

.brand-icon::after{
  transform:rotate(-35deg);
  right:6px;
}

.nav-links{

  display:flex;
  gap:38px;
}

.nav-links a{

  text-decoration:none;

  color:rgba(255,255,255,0.55);

  transition:
  color .3s ease,
  transform .3s ease;
}

.nav-links a:hover{
  color:white;
  transform:translateY(-1px);
}

.cta{

  border:none;

  background:var(--accent);
  color:black;

  padding:14px 24px;

  border-radius:999px;

  font-weight:700;

  cursor:pointer;

  transition:
  transform .35s cubic-bezier(0.22,1,0.36,1),
  box-shadow .35s cubic-bezier(0.22,1,0.36,1);
}

.cta:hover{

  transform:scale(1.04);

  box-shadow:
  0 0 20px rgba(212,255,0,0.25);
}

.hero{

  width:100%;
  height:calc(100% - 96px);

  display:grid;
  grid-template-columns:1.2fr 0.8fr;

  gap:64px;

  align-items:center;

  padding:20px 40px 40px;
}

.left{
  position:relative;
  z-index:5;
}

.headline{

  max-width:760px;

  font-size:clamp(64px,7vw,108px);

  font-weight:800;

  line-height:.95;

  letter-spacing:-0.04em;
}

.word{

  display:inline-block;

  margin-right:12px;

  opacity:0;

  transform:translateY(24px);

  filter:blur(10px);

  animation:reveal .8s forwards;
}

@keyframes reveal{

  to{
    opacity:1;
    transform:translateY(0px);
    filter:blur(0px);
  }
}

.description{

  margin-top:28px;

  max-width:520px;

  color:var(--text-muted);

  line-height:1.8;

  opacity:.78;
}

.secondary-btn{

  margin-top:38px;

  display:inline-flex;
  align-items:center;
  gap:12px;

  padding:14px 18px;

  border-radius:999px;

  border:1px solid rgba(255,255,255,0.08);

  background:rgba(255,255,255,0.05);

  cursor:pointer;

  transition:.3s ease;
}

.secondary-btn:hover{
  background:rgba(255,255,255,0.08);
}

.dot{

  width:8px;
  height:8px;

  border-radius:50%;

  background:white;
}

.right{

  position:relative;

  width:100%;
  height:100%;
}

.grid-bg{

  position:absolute;
  inset:0;

  background-image:
  linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
  linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);

  background-size:60px 60px;

  mask-image:radial-gradient(circle at center, black 40%, transparent 80%);
  -webkit-mask-image:radial-gradient(circle at center, black 40%, transparent 80%);
}

canvas{

  width:100%;
  height:100%;

  display:block;
}

@media(max-width:980px){

  .hero{
    grid-template-columns:1fr;
  }

  .right{
    height:420px;
  }

  .nav-links{
    display:none;
  }

}

@media(max-width:640px){

  .panel{
    width:100vw;
    height:100vh;
    border-radius:0;
  }

  .hero{
    padding:10px 24px 40px;
  }

  .headline{
    font-size:54px;
  }

  .navbar{
    padding:24px;
  }

}

</style>
</head>

<body>

<div class="panel">

  <nav class="navbar">

    <div class="brand">

      <div class="brand-icon"></div>

      <span>Zyra</span>

    </div>

    <div class="nav-links">

      <a href="#">Wallet</a>
      <a href="#">Feature</a>
      <a href="#">Token</a>
      <a href="#">Pricing</a>
      <a href="#">Community</a>

    </div>

    <button class="cta">
      Get Started
    </button>

  </nav>

  <section class="hero">

    <div class="left">

      <h1 class="headline" id="headline"></h1>

      <p class="description">
        Secure, lightning fast, and designed for seamless
        DeFi, NFT, and multi-chain experiences.
      </p>

      <button class="secondary-btn">

        <div class="dot"></div>

        Open App / Direct Demo

      </button>

    </div>

    <div class="right">

      <div class="grid-bg"></div>

      <canvas id="sphereCanvas"></canvas>

    </div>

  </section>

</div>

<script>

const text =
"Explore the Next Evolution of Web3 Wallets";

const headline =
document.getElementById("headline");

text.split(" ").forEach((word,index)=>{

  const span =
  document.createElement("span");

  span.className = "word";

  span.style.animationDelay =
  `${index * 0.08}s`;

  span.innerText = word + " ";

  headline.appendChild(span);

});

const canvas =
document.getElementById("sphereCanvas");

const ctx =
canvas.getContext("2d");

let w;
let h;

function resize(){

  w = canvas.width =
  canvas.offsetWidth;

  h = canvas.height =
  canvas.offsetHeight;

}

window.addEventListener(
  "resize",
  resize
);

resize();

const particles = [];

const particleCount = 1400;

for(let i=0;i<particleCount;i++){

  const theta =
  Math.random() * Math.PI * 2;

  const phi =
  Math.acos((Math.random()*2)-1);

  const radius = 170;

  particles.push({

    theta,
    phi,
    radius

  });

}

const stars = [];

for(let i=0;i<600;i++){

  stars.push({

    x:Math.random()*2000-1000,
    y:Math.random()*2000-1000,
    z:Math.random()*2000-1000,

    size:Math.random()*2

  });

}

let mouseX = 0;
let mouseY = 0;

let currentX = 0;
let currentY = 0;

window.addEventListener("mousemove",(e)=>{

  mouseX =
  (e.clientX / window.innerWidth - 0.5) * 2;

  mouseY =
  (e.clientY / window.innerHeight - 0.5) * 2;

});

function project(x,y,z){

  const depth = 500 + z;

  if(depth <= 0){

    return {
      x:0,
      y:0,
      scale:0
    };

  }

  const scale = 500 / depth;

  return {

    x:x * scale,
    y:y * scale,
    scale

  };

}

function animate(){

  ctx.clearRect(0,0,w,h);

  currentX +=
  (mouseX - currentX) * 0.03;

  currentY +=
  (mouseY - currentY) * 0.03;

  const centerX =
  w/2 + currentX * 60;

  const centerY =
  h/2 + currentY * 40;

  const time =
  Date.now() * 0.00025;

  stars.forEach(star=>{

    const p =
    project(star.x,star.y,star.z);

    if(!isFinite(p.scale)) return;

    const radius =
    Math.max(0.1,
    Math.min(4,star.size * p.scale));

    ctx.beginPath();

    ctx.fillStyle =
    "rgba(255,255,255,0.15)";

    ctx.arc(
      centerX + p.x * 0.12,
      centerY + p.y * 0.12,
      radius,
      0,
      Math.PI*2
    );

    ctx.fill();

  });

  const projected = [];

  particles.forEach(p=>{

    const x =
    p.radius *
    Math.sin(p.phi) *
    Math.cos(p.theta + time);

    const y =
    p.radius *
    Math.sin(p.phi) *
    Math.sin(p.theta + time);

    const z =
    p.radius *
    Math.cos(p.phi);

    const rotX =
    y * Math.cos(time*0.8) -
    z * Math.sin(time*0.8);

    const rotZ =
    y * Math.sin(time*0.8) +
    z * Math.cos(time*0.8);

    const proj =
    project(x,rotX,rotZ);

    projected.push({

      x:centerX + proj.x,
      y:centerY + proj.y,
      z:rotZ,
      scale:proj.scale

    });

  });

  for(let i=0;i<projected.length;i+=4){

    const a = projected[i];

    if(!a) continue;

    for(let j=i+1;j<i+4;j++){

      const b = projected[j];

      if(!b) continue;

      const dx = a.x - b.x;
      const dy = a.y - b.y;

      const dist =
      Math.sqrt(dx*dx + dy*dy);

      if(dist < 45){

        ctx.beginPath();

        ctx.strokeStyle =
        "rgba(255,255,255,0.05)";

        ctx.lineWidth = 0.5;

        ctx.moveTo(a.x,a.y);

        ctx.lineTo(b.x,b.y);

        ctx.stroke();

      }

    }

  }

  projected.forEach(p=>{

    if(
      !isFinite(p.x) ||
      !isFinite(p.y) ||
      !isFinite(p.scale)
    ){
      return;
    }

    const glow =
    Math.max(
      0,
      1 - (p.z + 200) / 400
    );

    const radius =
    Math.max(
      0.1,
      Math.min(10, 1.2 * p.scale)
    );

    ctx.beginPath();

    ctx.fillStyle =
    `rgba(255,255,255,${0.35 + glow})`;

    ctx.shadowBlur = 10;

    ctx.shadowColor = "#ffffff";

    ctx.arc(
      p.x,
      p.y,
      radius,
      0,
      Math.PI * 2
    );

    ctx.fill();

  });

  requestAnimationFrame(animate);

}

animate();

</script>

</body>
</html>
